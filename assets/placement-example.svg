<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="Placement worked example for a 2 GiB, 2 vCPU VM. Host A after placement: 4 GiB and 4 vCPU free, score 0.25, picked by the weighted score. Host B: 5 GiB and 0 vCPU free, score 0.15; memory-only placement would pick B and strand 5 GiB.">
  <style>
    .bg{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
    .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
    .m{fill:#59636e}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .card{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.2}
    .used{fill:#afb8c1}
    .new{fill:#0969da}
    .onnew{fill:#ffffff}
    .free{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.2}
    .ontfree{fill:#1a7f37}
    .hatch{stroke:#e8590c;stroke-width:2}
    .strand{stroke:#e8590c;stroke-width:1.6;fill:url(#hatch)}
    .accf{fill:#e8590c}
    .onacc{fill:#ffffff}
    .pill{fill:none;stroke:#d0d7de;stroke-width:1.2}
    .acc{fill:#e8590c}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117;stroke:#3d444d}
      .t{fill:#e6edf3} .m{fill:#9198a1}
      .card{fill:#161b22;stroke:#3d444d}
      .used{fill:#484f58} .new{fill:#4493f8} .onnew{fill:#0d1117}
      .free{fill:#0f2a17;stroke:#3fb950} .ontfree{fill:#3fb950}
      .hatch{stroke:#ff8a4c} .strand{stroke:#ff8a4c}
      .accf{fill:#ff8a4c} .onacc{fill:#0d1117} .pill{stroke:#3d444d} .acc{fill:#ff8a4c}
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="959" height="379" rx="12"/>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line class="hatch" x1="0" y1="0" x2="0" y2="8"/>
    </pattern>
  </defs>

  <!-- heading -->
  <text x="20" y="30" class="t" font-size="16" font-weight="700">Placing one VM: 2 GiB memory · 2 vCPU</text>
  <text x="20" y="52" class="t m" font-size="12.5">Both hosts: 16 GiB (15 allocatable) · 8 vCPU</text>

  <!-- legend -->
  <g font-size="12">
    <rect class="used" x="540" y="20" width="14" height="14" rx="3"/><text class="t m" x="560" y="31">used</text>
    <rect class="new"  x="606" y="20" width="14" height="14" rx="3"/><text class="t m" x="626" y="31">this VM</text>
    <rect class="free" x="690" y="20" width="14" height="14" rx="3"/><text class="t m" x="710" y="31">free after</text>
    <rect class="strand" x="785" y="20" width="14" height="14" rx="3"/><text class="t m" x="805" y="31">stranded memory</text>
  </g>

  <!-- ===== Host A ===== -->
  <rect class="card" x="20" y="72" width="450" height="290" rx="12"/>
  <text x="40" y="104" class="t" font-size="16" font-weight="700">Host A</text>
  <text x="450" y="104" class="t m" font-size="12" text-anchor="end">before: 9 GiB · 2 vCPU used</text>

  <text x="40" y="152" class="t m" font-size="12.5">Memory</text>
  <rect class="used" x="105" y="136" width="207" height="24" rx="3"/>
  <rect class="new"  x="312" y="136" width="46"  height="24"/>
  <rect class="free" x="358" y="136" width="92"  height="24" rx="3"/>
  <text x="208" y="153" class="t" font-size="12" text-anchor="middle">9 GiB</text>
  <text x="335" y="153" class="onnew" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">+2</text>
  <text x="404" y="153" class="ontfree" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">4 free</text>

  <text x="40" y="202" class="t m" font-size="12.5">vCPU</text>
  <rect class="used" x="105" y="186" width="86.25"  height="24" rx="3"/>
  <rect class="new"  x="191.25" y="186" width="86.25" height="24"/>
  <rect class="free" x="277.5" y="186" width="172.5" height="24" rx="3"/>
  <text x="148" y="203" class="t" font-size="12" text-anchor="middle">2</text>
  <text x="234" y="203" class="onnew" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">+2</text>
  <text x="364" y="203" class="ontfree" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">4 free</text>

  <text x="40" y="252" class="t mono" font-size="13">M′ 0.27 · C′ 0.50 · F 0.23</text>
  <text x="40" y="278" class="t mono" font-size="13">S = 0.60·M′ + 0.25·C′ − 0.15·F = <tspan font-weight="700">0.25</tspan></text>
  <rect class="acc" x="40" y="300" width="410" height="40" rx="20"/>
  <text x="245" y="325" class="onacc" font-family="sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">✓ Weighted score picks Host A</text>

  <!-- ===== Host B ===== -->
  <rect class="card" x="490" y="72" width="450" height="290" rx="12"/>
  <text x="510" y="104" class="t" font-size="16" font-weight="700">Host B</text>
  <text x="920" y="104" class="t m" font-size="12" text-anchor="end">before: 8 GiB · 6 vCPU used</text>

  <text x="510" y="152" class="t m" font-size="12.5">Memory</text>
  <rect class="used" x="575" y="136" width="184" height="24" rx="3"/>
  <rect class="new"  x="759" y="136" width="46"  height="24"/>
  <rect class="strand" x="805" y="136" width="115" height="24" rx="3"/>
  <text x="667" y="153" class="t" font-size="12" text-anchor="middle">8 GiB</text>
  <text x="782" y="153" class="onnew" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">+2</text>

  <text x="510" y="202" class="t m" font-size="12.5">vCPU</text>
  <rect class="used" x="575" y="186" width="258.75" height="24" rx="3"/>
  <rect class="new"  x="833.75" y="186" width="86.25" height="24"/>
  <text x="704" y="203" class="t" font-size="12" text-anchor="middle">6</text>
  <text x="877" y="203" class="onnew" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">+2</text>

  <text x="510" y="252" class="t mono" font-size="13">M′ 0.33 · C′ 0.00 · F 0.33</text>
  <text x="510" y="278" class="t mono" font-size="13">S = 0.60·M′ + 0.25·C′ − 0.15·F = <tspan font-weight="700">0.15</tspan></text>
  <rect class="pill" x="510" y="300" width="410" height="40" rx="20"/>
  <text x="715" y="325" class="t m" font-size="13" text-anchor="middle">Memory-only picks B → 5 GiB left with 0 vCPU</text>
</svg>
