<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-label="Create-VM sequence: user POSTs to API, API writes Pending to etcd, scheduler binds a host and reserves memory in a transaction, controller sees Bound and calls the agent over mTLS, agent sets up cgroup and TAP, spawns the VMM and calls vm.create and vm.boot, then reports Running. Steps 4 to 8 are rolled back in reverse on failure.">
  <style>
    .bg{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
    .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
    .m{fill:#59636e}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.2}
    .life{stroke:#afb8c1;stroke-width:1.2;stroke-dasharray:4 4}
    .ln{stroke:#59636e;stroke-width:1.4;fill:none}
    .dash{stroke-dasharray:5 4}
    .acc{stroke:#e8590c;stroke-width:2.2;fill:none}
    .accf{fill:#e8590c}
    .band{fill:#e8590c;fill-opacity:.07;stroke:#e8590c;stroke-opacity:.35;stroke-dasharray:4 4}
    .note{fill:#fff8f5;stroke:#e8590c;stroke-opacity:.5}
    .mk{fill:#59636e}
    .halo{paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117;stroke:#3d444d}
      .t{fill:#e6edf3} .m{fill:#9198a1}
      .box{fill:#161b22;stroke:#3d444d} .life{stroke:#3d444d}
      .ln{stroke:#9198a1} .mk{fill:#9198a1}
      .acc{stroke:#ff8a4c} .accf{fill:#ff8a4c}
      .band{fill:#ff8a4c;fill-opacity:.08;stroke:#ff8a4c}
      .note{fill:#1f1510;stroke:#ff8a4c}
      .halo{stroke:#0d1117}
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="959" height="579" rx="12"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="mk" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="accf" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- rollback band (steps 4-8) -->
  <rect class="band" x="280" y="192" width="660" height="196" rx="8"/>
  <text x="290" y="381" class="t m halo" font-size="11" font-weight="600">compensable · steps 4–8</text>

  <!-- participants -->
  <g font-size="13" font-weight="600" text-anchor="middle">
    <rect class="box" x="10"  y="16" width="120" height="36" rx="8"/><text class="t" x="70"  y="39">User</text>
    <rect class="box" x="145" y="16" width="120" height="36" rx="8"/><text class="t" x="205" y="39">API</text>
    <rect class="box" x="280" y="16" width="120" height="36" rx="8"/><text class="t" x="340" y="39">Scheduler</text>
    <rect class="box" x="415" y="16" width="120" height="36" rx="8"/><text class="t" x="475" y="39">etcd</text>
    <rect class="box" x="550" y="16" width="120" height="36" rx="8"/><text class="t" x="610" y="39">Controller</text>
    <rect class="box" x="685" y="16" width="120" height="36" rx="8"/><text class="t" x="745" y="39">Agent</text>
    <rect class="box" x="820" y="16" width="120" height="36" rx="8"/><text class="t" x="880" y="39" font-size="12">Cloud Hypervisor</text>
  </g>

  <!-- lifelines -->
  <g class="life">
    <path d="M70,52 V470"/><path d="M205,52 V470"/><path d="M340,52 V470"/><path d="M475,52 V470"/>
    <path d="M610,52 V470"/><path d="M745,52 V470"/><path d="M880,52 V470"/>
  </g>

  <!-- messages -->
  <g font-size="12" text-anchor="middle">
    <path class="ln" d="M70,92 H203" marker-end="url(#ah)"/>
    <text class="t halo" x="137" y="85">1. POST /v1/vms (token)</text>

    <path class="ln" d="M205,132 H473" marker-end="url(#ah)"/>
    <text class="t halo" x="340" y="125">2. auth, check limits, put Pending</text>

    <path class="ln dash" d="M475,172 H342" marker-end="url(#ah)"/>
    <text class="t halo" x="407" y="165">3. watch Pending</text>

    <path class="ln" d="M340,212 H473" marker-end="url(#ah)"/>
    <text class="t halo" x="407" y="205">4. txn: bind host + reserve</text>

    <path class="ln dash" d="M475,252 H608" marker-end="url(#ah)"/>
    <text class="t halo" x="542" y="245">5. watch Bound</text>

    <path class="acc" d="M610,292 H743" marker-end="url(#aha)"/>
    <text class="t halo" x="677" y="285" font-weight="600">6. CreateVM (mTLS)</text>

    <path class="ln" d="M745,332 H878" marker-end="url(#ah)"/>
    <text class="t halo" x="812" y="325">7. cgroup + TAP + spawn</text>

    <path class="ln" d="M745,372 H878" marker-end="url(#ah)"/>
    <text class="t halo mono" x="812" y="365" font-size="11.5">8. vm.create, vm.boot</text>

    <path class="ln dash" d="M745,412 H612" marker-end="url(#ah)"/>
    <text class="t halo" x="677" y="405">9. OK → Running</text>

    <path class="ln dash" d="M205,452 H72" marker-end="url(#ah)"/>
    <text class="t halo" x="137" y="445">10. 201 Created</text>
  </g>

  <!-- rollback note -->
  <rect class="note" x="20" y="490" width="920" height="72" rx="10"/>
  <text x="40" y="518" class="t" font-size="13" font-weight="600">If any of steps 4–8 fails, run the compensations in reverse:</text>
  <text x="40" y="544" class="t mono" font-size="12">vm.delete → vmm.shutdown → kill/reap PID → remove socket, TAP, cgroup → release reservation → Failed</text>
</svg>
