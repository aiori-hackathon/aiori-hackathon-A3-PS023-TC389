<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-label="Saga rollback: each create step (reserve memory, cgroup, TAP device, spawn VMM, vm.create, vm.boot) has a compensating action (release, rmdir, ip link del, shutdown and kill, vm.delete, vm.shutdown) run in reverse order.">
  <style>
    .bg{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
    .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
    .m{fill:#59636e}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.2}
    .ubox{fill:#fff8f5;stroke:#e8590c;stroke-opacity:.6;stroke-width:1.2}
    .ln{stroke:#59636e;stroke-width:1.4;fill:none}
    .dot{stroke:#afb8c1;stroke-width:1.2;stroke-dasharray:2 4}
    .acc{stroke:#e8590c;stroke-width:2;fill:none}
    .accf{fill:#e8590c}
    .acct{fill:#bc4c00}
    .mk{fill:#59636e}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117;stroke:#3d444d}
      .t{fill:#e6edf3} .m{fill:#9198a1}
      .box{fill:#161b22;stroke:#3d444d} .ubox{fill:#1f1510;stroke:#ff8a4c}
      .ln{stroke:#9198a1} .dot{stroke:#3d444d} .mk{fill:#9198a1}
      .acc{stroke:#ff8a4c} .accf{fill:#ff8a4c} .acct{fill:#ff8a4c}
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="959" height="249" rx="12"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="mk" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="accf" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <text x="20" y="24" class="t" font-size="15" font-weight="700">Every create step has a compensating action</text>
  <text x="940" y="24" class="t m" font-size="12" text-anchor="end">each step is journaled on the agent before it runs</text>

  <text x="20" y="48" class="t m" font-size="11" font-weight="700" letter-spacing="1">DO  →</text>
  <text x="20" y="148" class="acct" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1">←  UNDO (reverse order)</text>

  <!-- connectors -->
  <g class="dot">
    <path d="M87.5,102 V156"/><path d="M242.5,102 V156"/><path d="M397.5,102 V156"/>
    <path d="M552.5,102 V156"/><path d="M707.5,102 V156"/><path d="M862.5,102 V156"/>
  </g>

  <!-- do row -->
  <g font-size="13" text-anchor="middle">
    <rect class="box" x="20"  y="56" width="135" height="46" rx="8"/><text class="t mono" x="87.5"  y="84">reserve mem</text>
    <rect class="box" x="175" y="56" width="135" height="46" rx="8"/><text class="t mono" x="242.5" y="84">cgroup</text>
    <rect class="box" x="330" y="56" width="135" height="46" rx="8"/><text class="t mono" x="397.5" y="84">TAP device</text>
    <rect class="box" x="485" y="56" width="135" height="46" rx="8"/><text class="t mono" x="552.5" y="84">spawn VMM</text>
    <rect class="box" x="640" y="56" width="135" height="46" rx="8"/><text class="t mono" x="707.5" y="84">vm.create</text>
    <rect class="box" x="795" y="56" width="135" height="46" rx="8"/><text class="t mono" x="862.5" y="84">vm.boot</text>
  </g>
  <g class="ln">
    <path d="M155,79 H173" marker-end="url(#ah)"/><path d="M310,79 H328" marker-end="url(#ah)"/>
    <path d="M465,79 H483" marker-end="url(#ah)"/><path d="M620,79 H638" marker-end="url(#ah)"/>
    <path d="M775,79 H793" marker-end="url(#ah)"/>
  </g>

  <!-- undo row -->
  <g font-size="13" text-anchor="middle">
    <rect class="ubox" x="20"  y="156" width="135" height="46" rx="8"/><text class="t mono" x="87.5"  y="184">release</text>
    <rect class="ubox" x="175" y="156" width="135" height="46" rx="8"/><text class="t mono" x="242.5" y="184">rmdir</text>
    <rect class="ubox" x="330" y="156" width="135" height="46" rx="8"/><text class="t mono" x="397.5" y="184">ip link del</text>
    <rect class="ubox" x="485" y="156" width="135" height="46" rx="8"/><text class="t mono" x="552.5" y="184" font-size="12">shutdown, kill</text>
    <rect class="ubox" x="640" y="156" width="135" height="46" rx="8"/><text class="t mono" x="707.5" y="184">vm.delete</text>
    <rect class="ubox" x="795" y="156" width="135" height="46" rx="8"/><text class="t mono" x="862.5" y="184">vm.shutdown</text>
  </g>
  <g class="acc">
    <path d="M175,179 H157" marker-end="url(#aha)"/><path d="M330,179 H312" marker-end="url(#aha)"/>
    <path d="M485,179 H467" marker-end="url(#aha)"/><path d="M640,179 H622" marker-end="url(#aha)"/>
    <path d="M795,179 H777" marker-end="url(#aha)"/>
  </g>

  <text x="20" y="234" class="t m" font-size="12.5">A crashed agent replays its journal on restart and finishes the rollback — no orphan process, socket, TAP device, cgroup or reservation.</text>
</svg>
